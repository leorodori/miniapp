services:
  web:
    build: .
    command: ["/rails/bin/docker-entrypoint", "/rails/bin/rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      SELENIUM_DRIVER_URL: "http://chrome:4444"
    depends_on:
      - db
      - chrome

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"

volumes:
  postgres-data: